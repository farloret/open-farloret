name: Publish Scarlet demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'public/assets/**'
      - 'public/chat-id.js'
      - 'public/chat-search.js'
      - 'public/composer-toolbar.css'
      - 'public/model-picker.css'
      - 'public/model-picker.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Scarlet preview and self-hosted server
        run: |
          node --check pages/demo.js
          node --check pages/demo-state.mjs
          node --check public/model-picker.js
          node --check public/chat-id.js
          node --check public/chat-search.js
          node --check public/app.js
          node --check server.js
          npm test
      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp public/assets/scarlet-logo.png public/assets/ui-icons.svg _site/assets/
          cp pages/index.html pages/demo.js pages/demo-state.mjs pages/demo.css _site/
          cp public/model-picker.js public/model-picker.css _site/
          cp public/chat-id.js public/chat-search.js public/composer-toolbar.css _site/
          # Pages moves the preview to the root; resolve the UUID module there.
          sed -i "s#../public/chat-id.js#./chat-id.js#g" _site/demo-state.mjs
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/demo.js
          test -s _site/demo.css
          test -s _site/model-picker.js
          test -s _site/model-picker.css
          test -s _site/chat-id.js
          test -s _site/chat-search.js
          test -s _site/composer-toolbar.css
          ! grep -F "../public/chat-id.js" _site/demo-state.mjs
          test -s _site/assets/scarlet-logo.png
          test -s _site/assets/ui-icons.svg
          ! grep -E 'src="/|href="/' _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public preview
        id: deployment
        uses: actions/deploy-pages@v4
