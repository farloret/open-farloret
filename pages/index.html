<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Explore the Open Farloret interface in a free browser-only demo. No model, no account, no AI requests.">
  <title>Open Farloret - Scarlet Preview</title>
  <link rel="icon" type="image/png" href="./assets/scarlet-logo.png">
  <link rel="apple-touch-icon" href="./assets/scarlet-logo.png">
  <link rel="stylesheet" href="./demo.css">
  <link rel="stylesheet" href="./model-picker.css">
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar" aria-label="Chat navigation">
    <div class="sidebar-heading">
      <div class="identity"><img class="identity-logo" src="./assets/scarlet-logo.png" width="30" height="30" alt="" aria-hidden="true"><span>Open Farloret</span></div>
      <button id="collapse" class="icon-button" type="button" aria-label="Close sidebar" title="Close sidebar">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#panel-hide"></use></svg>
      </button>
    </div>
    <div class="sidebar-tools">
      <button class="nav-action" id="new" type="button">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg?v=3#compose"></use></svg>
        <span>New chat</span>
      </button>
      <button class="nav-action" id="search-toggle" type="button" aria-controls="searchbox" aria-expanded="false">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#search"></use></svg>
        <span>Search chats</span><span class="shortcut">Ctrl K</span>
      </button>
      <div id="searchbox" class="searchbox" hidden>
        <label for="search" class="sr-only">Search conversations</label>
        <input id="search" type="search" placeholder="Search conversations" autocomplete="off">
        <button id="search-close" class="icon-button" type="button" aria-label="Close search"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#close"></use></svg></button>
      </div>
    </div>
    <div class="history-heading">Recent</div>
    <nav id="chats" class="chats" aria-label="Local conversations"></nav>
    <div class="sidebar-bottom">
      <button id="theme" type="button" class="utility-row" title="Switch appearance">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#theme-moon"></use></svg>
        <span>Appearance</span><span id="theme-label" class="utility-detail">Light</span>
      </button>
      <button id="export" type="button" class="utility-row" title="Download conversations as JSON">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#download"></use></svg>
        <span>Export chats</span>
      </button>
      <button id="clear" type="button" class="utility-row" title="Delete local demo chats">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#trash"></use></svg>
        <span>Clear history</span>
      </button>
      <div class="build-info"><img class="build-logo" src="./assets/scarlet-logo.png" width="31" height="31" alt="" aria-hidden="true"><span><strong>Scarlet</strong><small>Public preview &middot; 0.1</small></span></div>
    </div>
  </aside>
  <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>
  <main id="main" class="chat-main is-empty">
    <header class="topbar">
      <button id="expand" class="icon-button" type="button" aria-label="Open sidebar" title="Open sidebar">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#panel-show"></use></svg>
      </button>
      <div class="model-picker" id="model-picker">
        <button class="model-trigger" id="model-trigger" type="button" role="combobox" aria-label="Choose model" aria-haspopup="listbox" aria-expanded="false" aria-controls="model-options" data-model-trigger>
          <span class="model-trigger-label" data-model-label>Blank model</span>
          <svg class="ui-icon model-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#chevron-down"></use></svg>
        </button>
        <div class="model-popover" data-model-popup hidden>
          <div class="model-popover-head"><span>Models</span><span class="model-popover-count" data-model-count></span></div>
          <div class="model-options" id="model-options" role="listbox" aria-label="Available models" data-model-listbox></div>
          <div class="model-popover-foot" data-model-footer></div>
        </div>
      </div>
      <div class="topbar-right"><span class="preview-dot" aria-hidden="true"></span><span>Public preview</span></div>
    </header>
    <div class="workspace">
      <section id="conversation" class="conversation" aria-label="Current conversation">
        <div id="welcome" class="welcome">
          <h1>What would you like to explore?</h1>
          <p>Try the Open Farloret interface with a blank model.</p>
        </div>
        <div id="messages" class="messages" role="log" aria-label="Messages"></div>
        <p id="silent-note" class="silent-note" hidden><svg class="ui-icon silent-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#info"></use></svg> The blank model is intentionally silent. It won't generate a reply.</p>
      </section>
      <div class="bottom">
        <form id="composer" class="composer">
          <label class="sr-only" for="prompt">Message the blank model</label>
          <textarea id="prompt" rows="1" maxlength="20000" placeholder="Message Blank" aria-label="Message the blank model"></textarea>
          <div class="composer-toolbar">
            <span class="composer-model"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#model"></use></svg> Blank model</span>
            <button id="send" class="send-button" type="submit" title="Send message" aria-label="Send message" disabled>
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#send"></use></svg>
            </button>
          </div>
        </form>
        <p class="disclaimer">UI demo only. No AI responses or server requests.</p>
        <p id="notice" class="notice" role="status" aria-live="polite"></p>
      </div>
      <div id="suggestions" class="suggestions" aria-label="Example prompts">
        <button type="button" data-prompt="Hello, blank model!">Try a message <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#open-arrow"></use></svg></button>
        <button type="button" data-prompt="I am testing this interface.">Test a conversation <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#open-arrow"></use></svg></button>
        <button type="button" data-prompt="This will be saved on my device.">Explore history <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="./assets/ui-icons.svg#open-arrow"></use></svg></button>
      </div>
    </div>
  </main>
</div>
<script type="module" src="./demo.js"></script>
</body>
</html>
