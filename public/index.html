<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#faf9f7"><title>Open Farloret · Scarlet</title><link rel="icon" type="image/png" href="/assets/scarlet-logo.png"><link rel="apple-touch-icon" href="/assets/scarlet-logo.png"><link rel="stylesheet" href="/styles.css"></head><body><div class="app"><aside id="sidebar"><div class="brand"><img class="brand-logo" src="/assets/scarlet-logo.png" width="34" height="34" alt="" aria-hidden="true"><span>Open Farloret<small>SCARLET DEVELOPMENT</small></span><button id="collapse" class="icon-action" type="button" aria-label="Collapse sidebar" title="Collapse sidebar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg#panel-hide"></use></svg></button></div><button class="new" id="new" type="button"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg?v=2#compose"></use></svg><span>New chat</span></button><div class="search-wrap"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg#search"></use></svg><input id="search" placeholder="Search conversations" aria-label="Search conversations"></div><div class="section">RECENT CHATS</div><nav id="chats"></nav><div class="foot"><span class="dot"></span>Scarlet 0.1 <button id="theme" class="icon-action" type="button" aria-label="Toggle appearance" title="Toggle appearance"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg#theme-moon"></use></svg></button></div></aside><main><header><button id="expand" class="icon-action" type="button" aria-label="Expand sidebar" title="Expand sidebar"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg#panel-show"></use></svg></button><select id="model" aria-label="Select AI model"><option value="">Select a model</option></select><span class="stage">EARLY PREVIEW</span></header><section id="conversation"><div id="welcome"><img class="welcome-logo" src="/assets/scarlet-logo.png" width="58" height="58" alt="Open Farloret Scarlet logo"><h1>What are we exploring today?</h1><p>Choose a model and start a conversation.</p><div class="prompts"><button data-prompt="Explain something complex in simple terms.">Explain a concept <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg#open-arrow"></use></svg></button><button data-prompt="Help me brainstorm a creative idea.">Brainstorm ideas <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg#open-arrow"></use></svg></button><button data-prompt="Write a short Python script for me.">Write some code <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg#open-arrow"></use></svg></button></div></div><div id="messages"></div></section><div class="bottom"><form id="composer"><textarea id="prompt" rows="1" placeholder="Message your model…" aria-label="Message your model"></textarea><div class="composer-foot"><span>Enter to send · Shift+Enter for a newline</span><button id="send" type="submit" aria-label="Send message" title="Send message"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/assets/ui-icons.svg#send"></use></svg></button></div></form><p>Models can make mistakes. Check important information.</p></div></main></div><script type="module" src="/app.js"></script></body></html>
